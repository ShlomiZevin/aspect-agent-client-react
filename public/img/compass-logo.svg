<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Outer circle -->
  <circle cx="128" cy="128" r="110" fill="none" stroke="#2563EB" stroke-width="8"/>
  <!-- Inner ring -->
  <circle cx="128" cy="128" r="85" fill="none" stroke="#93C5FD" stroke-width="3"/>
  <!-- Cardinal tick marks -->
  <line x1="128" y1="18" x2="128" y2="38" stroke="#2563EB" stroke-width="5" stroke-linecap="round"/>
  <line x1="238" y1="128" x2="218" y2="128" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/>
  <line x1="128" y1="238" x2="128" y2="218" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/>
  <line x1="18" y1="128" x2="38" y2="128" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/>
  <!-- N label -->
  <text x="128" y="56" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#1D4ED8">N</text>
  <!-- North needle (blue) -->
  <polygon points="128,60 118,128 128,118 138,128" fill="#1D4ED8"/>
  <!-- South needle (light blue) -->
  <polygon points="128,196 118,128 128,138 138,128" fill="#93C5FD"/>
  <!-- Center dot -->
  <circle cx="128" cy="128" r="7" fill="#1D4ED8"/>
</svg>
