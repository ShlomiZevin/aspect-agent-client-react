document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

stant',sans-serif;\n  --font-display:'Assistant',sans-serif;\n  --font-mono:'JetBrains Mono',monospace;\n\n  --text-h1:800 clamp(32px,4.5vw,48px)/1.1 var(--font-display);\n  --text-h2:700 clamp(24px,3vw,32px)/1.15 var(--font-display);\n  --text-h3:600 22px/1.25 var(--font-display);\n  --text-body-lg:400 16px/1.7 var(--font-heb);\n  --text-body:400 14px/1.7 var(--font-heb);\n  --text-caption:500 12px/1.5 var(--font-heb);\n  --text-eyebrow:700 11px/1.4 var(--font-mono);\n}\n\n:root{\n  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px;\n  --space-6:24px; --space-8:32px; --space-10:40px; --space-12:48px;\n  --space-15:60px; --space-20:80px;\n\n  --radius-sm:8px; --radius-md:12px; --radius-lg:16px; --radius-xl:18px;\n  --radius-pill:100px; --radius-round:50%;\n\n  --shadow-card:0 10px 36px rgba(0,0,0,.3);\n  --shadow-glow-pink:0 12px 30px rgba(224,25,138,.28), 0 0 0 2px rgba(240,96,176,.5);\n  --shadow-inset-top:inset 0 1px 0 rgba(255,255,255,.12);\n}\n\n<\u002Fstyle>\n  <script src=\"0b07c311-7fc5-4ab0-b04b-967f2369aa44\"><\u002Fscript>\n  <style>\n    body { margin: 0; background: #000; }\n    a { color: var(--pink-light); }\n    a:hover { color: var(--pink); }\n    @keyframes pulseGlow {\n      0%, 100% { transform: scale(1); box-shadow: 0 0 90px rgba(224,25,138,.4); }\n      50% { transform: scale(1.06); box-shadow: 0 0 140px rgba(224,25,138,.7); }\n    }\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<x-import component-from-global-scope=\"deck-stage\" from=\"b6015dee-cfd6-4d0e-92f7-198e3a0822a8#/deck-stage.js\" width=\"1920\" height=\"1080\" hint-size=\"100%,100%\" data-uneditable=\"\">\n\n<section data-label=\"Cover\" data-speaker-notes=\"Open cold. Let the headline sit. Do not summarize it out loud.\" style=\"background: var(--dark); padding: 110px 150px; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden;\">\n  <div style=\"position: absolute; right: -220px; top: 50%; transform: translateY(-50%);\">\n    <x-import component-from-global-scope=\"LybiDesignSystem_fd38ba.Spiral\" size=\"680\" color=\"#1E1040\" hint-size=\"680px,680px\"><\u002Fx-import>\n  <\u002Fdiv>\n  <img src=\"4f0763ef-8569-4279-850a-30247a1b337b\" style=\"height: 36px; width: auto; align-self: flex-start; margin-bottom: 60px;\" alt=\"Lybi\">\n  <h1 style=\"font: 300 100px/1.1 'Assistant', sans-serif; color: #fff; margin: 0; max-width: 1550px;\">The Conative AI platform for <b style=\"font-weight: 800; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;\">high-value customer journeys.<\u002Fb><\u002Fh1>\n  <div style=\"width: 140px; height: 4px; background: var(--grad); margin: 56px 0 40px;\"><\u002Fdiv>\n  <span style=\"font: 700 13px/1.4 'JetBrains Mono', monospace; letter-spacing: 4px; color: var(--text-on-dark-3);\">CONFIDENTIAL<\u002Fspan>\n<\u002Fsection>\n\n<section data-label=\"Agentic AI\" data-speaker-notes=\"Set up the premise everyone agrees with before the turn.\" style=\"background: var(--dark); padding: 90px 130px; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden;\">\n  <img src=\"4f0763ef-8569-4279-850a-30247a1b337b\" style=\"position: absolute; bottom: 50px; left: 130px; height: 22px; width: auto; opacity: .55; z-index: 1;\" alt=\"Lybi\">\n  <span style=\"position: absolute; right: 40px; bottom: -130px; font: 800 560px/1 'Assistant', sans-serif; color: rgba(255,255,255,.035); pointer-events: none;\">02<\u002Fspan>\n  <div style=\"position: relative; z-index: 1; display: flex; align-items: center; gap: 12px; margin-bottom: 40px;\"><span style=\"width: 26px; height: 3px; background: var(--grad); display: inline-block;\"><\u002Fspan><span style=\"font: 700 30px/1.4 'JetBrains Mono', monospace; letter-spacing: 4px; color: var(--pink-light);\">THE AGENTIC AI REVOLUTION<\u002Fspan><\u002Fdiv>\n  <h2 style=\"position: relative; z-index: 1; font: 300 76px/1.22 'Assistant', sans-serif; color: #fff; max-width: 1550px; margin: 0 0 64px;\">Agentic AI is redefining <b style=\"font-weight: 800;\">what systems can do.<\u002Fb><\u002Fh2>\n  <p style=\"position: relative; z-index: 1; font: 400 32px/1.55 'Assistant', sans-serif; color: var(--white); max-width: 1500px; margin: 0 0 28px; font-size: 45px; font-weight: 400\">Banks are investing heavily in:<\u002Fp>\n  <p style=\"position: relative; z-index: 1; font: 700 40px/1.4 'Assistant', sans-serif; color: var(--line-mid); max-width: 1500px; margin: 0 0 44px; font-size: 45px; font-weight: 400\">better reasoning.&nbsp; &nbsp; greater agency.&nbsp; &nbsp; &nbsp; more autonomous action<\u002Fp><p style=\"position: relative; z-index: 1; font: 400 32px/1.55 'Assistant', sans-serif; color: var(--surface-card); max-width: 1450px; margin: 0 0 28px; font-size: 45px; font-weight: 400\">To realize AI's potential to transform the economics of service.<\u002Fp>\n  \n  \n  <p style=\"position: relative; z-index: 1; font: 800 44px/1.3 'Assistant', sans-serif; color: var(--magenta); margin: 0; font-size: 80px\">But what about the top line?<\u002Fp>\n  <span style=\"position: absolute; bottom: 50px; right: 130px; font: 700 13px/1.4 'JetBrains Mono', monospace; letter-spacing: 2px; color: var(--text-on-dark-3); z-index: 1;\">02<\u002Fspan>\n<\u002Fsection>\n\n<section data-label=\"Top line\" data-speaker-notes=\"Land the business stakes: everything traces to one customer decision.\" style=\"background: var(--dark); padding: 90px 130px; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden;\">\n  <img src=\"4f0763ef-8569-4279-850a-30247a1b337b\" style=\"position: absolute; bottom: 50px; left: 130px; height: 22px; width: auto; opacity: .55; z-index: 1;\" alt=\"Lybi\">\n  <span style=\"position: absolute; right: 40px; bottom: -130px; font: 800 560px/1 'Assistant', sans-serif; color: rgba(255,255,255,.035); pointer-events: none;\">03<\u002Fspan>\n  <div style=\"position: relative; z-index: 1; display: flex; align-items: center; gap: 12px; margin-bottom: 40px;\"><span style=\"width: 26px; height: 3px; background: var(--grad); display: inline-block;\"><\u002Fspan><span style=\"font: 700 30px/1.4 'JetBrains Mono', monospace; letter-spacing: 4px; color: var(--pink-light);\">THE BUSINESS OUTCOME<\u002Fspan><\u002Fdiv>\n  <h2 style=\"position: relative; z-index: 1; font: 300 66px/1.32 'Assistant', sans-serif; color: #fff; max-width: 1600px; margin: 0 0 64px;\">The top line: sales, share of wallet, and retention—depends on one thing: <b style=\"font-weight: 800; color: var(--accent);\">a customer making a decision.<\u002Fb><\u002Fh2>\n  <div style=\"position: relative; z-index: 1; display: flex; flex-direction: column; gap: 22px; margin-bottom: 64px;\">\n    <span style=\"font: 400 36px/1.35 'Assistant', sans-serif; color: var(--text-on-dark-2); font-size: 40px\">To take out a mortgage.<\u002Fspan>\n    <span style=\"font: 400 36px/1.35 'Assistant', sans-serif; color: var(--text-on-dark-2); font-size: 40px\">Secure a loan.<\u002Fspan>\n    <span style=\"font: 400 36px/1.35 'Assistant', sans-serif; color: var(--text-on-dark-2); font-size: 40px\">Open an account.<\u002Fspan>\n    <span style=\"font: 400 36px/1.35 'Assistant', sans-serif; color: var(--text-on-dark-2); font-size: 40px\">Move their financial activity.<\u002Fspan>\n  <\u002Fdiv>\n  <p style=\"position: relative; z-index: 1; font: 700 40px/1.35 'Assistant', sans-serif; color: var(--magenta); margin: 0; font-size: 60px\">Make a choice - and move forward.<\u002Fp>\n  <span style=\"position: absolute; bottom: 50px; right: 130px; font: 700 13px/1.4 'JetBrains Mono', monospace; letter-spacing: 2px; color: var(--text-on-dark-3); z-index: 1;\">03<\u002Fspan>\n<\u002Fsection>\n\n<section data-label=\"The customer decision\" data-speaker-notes=\"The system cannot decide for the customer — that's the whole point.\" style=\"background: var(--dark); padding: 90px 130px; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden;\">\n  <img src=\"4f0763ef-8569-4279-850a-30247a1b337b\" style=\"position: absolute; bottom: 50px; left: 130px; height: 22px; width: auto; opacity: .55; z-index: 1;\" alt=\"Lybi\">\n  <span style=\"position: absolute; right: 40px; bottom: -130px; font: 800 560px/1 'Assistant', sans-serif; color: rgba(255,255,255,.035); pointer-events: none;\">04<\u002Fspan>\n  <div style=\"position: relative; z-index: 1; display: flex; align-items: center; gap: 12px; margin-bottom: 40px;\"><span style=\"width: 26px; height: 3px; background: var(--grad); display: inline-block;\"><\u002Fspan><span style=\"font: 700 30px/1.4 'JetBrains Mono', monospace; letter-spacing: 4px; color: var(--pink-light);\">HIGH-VALUE CUSTOMER JOURNEYS<\u002Fspan><\u002Fdiv>\n  <h2 style=\"position: relative; z-index: 1; font: 300 58px/1.35 'Assistant', sans-serif; color: #fff; max-width: 1650px; margin: 0 0 56px;\">In high-value customer journeys, the system cannot create the outcome on its own. <b style=\"font-weight: 800; color: var(--pink-dark)\">The customer must decide.<\u002Fb><\u002Fh2>\n  <div style=\"position: relative; z-index: 1; width: 140px; height: 4px; background: var(--grad); margin-bottom: 44px;\"><\u002Fdiv>\n  <p style=\"position: relative; z-index: 1; font: 400 32px/1.65 'Assistant', sans-serif; color: var(--text-on-dark-2); max-width: 1500px; margin: 0; font-size: 60px\"><b style=\"color: var(--magenta)\">But customers do not make decisions rationally<\u002Fb>. <br>Their choices are shaped by hidden motives, constraints, identity, fears, biases, trust, and past experience-&nbsp;<\u002Fp>\n  <span style=\"position: absolute; bottom: 50px; right: 130px; font: 700 13px/1.4 'JetBrains Mono', monospace; letter-spacing: 2px; color: var(--text-on-dark-3); z-index: 1;\">04<\u002Fspan>\n<\u002Fsection>\n\n<section data-label=\"The system blind spot\" data-speaker-notes=\"Name the gap in existing digital/AI systems directly.\" style=\"background: var(--dark); padding: 90px 130px; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden;\">\n  <img src=\"4f0763ef-8569-4279-850a-30247a1b337b\" style=\"position: absolute; bottom: 50px; left: 130px; height: 22px; width: auto; opacity: .55; z-index: 1;\" alt=\"Lybi\">\n  <span style=\"position: absolute; right: 40px; bottom: -130px; font: 800 560px/1 'Assistant', sans-serif; color: rgba(255,255,255,.035); pointer-events: none;\">05<\u002Fspan>\n  <div style=\"position: relative; z-index: 1; display: flex; align-items: center; gap: 12px; margin-bottom: 40px;\"><span style=\"width: 26px; height: 3px; background: var(--grad); display: inline-block;\"><\u002Fspan><span style=\"font: 700 30px/1.4 'JetBrains Mono', monospace; letter-spacing: 4px; color: var(--pink-light);\">THE SYSTEM'S BLIND SPOT<\u002Fspan><\u002Fdiv>\n  <h2 style=\"position: relative; z-index: 1; font: 300 58px/1.4 'Assistant', sans-serif; color: #fff; max-width: 1600px; margin: 0 0 44px;\">Digital and AI systems managing the journey can track and execute the process. But they still lack visibility into <b style=\"font-weight: 800; color: var(--pink-dark)\">what governs the customer's decision.<\u002Fb><\u002Fh2>\n  <p style=\"position: relative; z-index: 1; font: 400 30px/1.6 'Assistant', sans-serif; color: var(--text-on-dark-2); max-width: 1500px; margin: 0 0 44px; font-size: 45px\">Human decision paths do not follow the rational logic that structures digital flows, decision trees, and AI reasoning. Much of what shapes the decision unfolds beneath the surface.<\u002Fp>\n  <div style=\"position: relative; z-index: 1; width: 140px; height: 4px; background: var(--grad); margin-bottom: 44px;\"><\u002Fdiv>\n  <p style=\"position: relative; z-index: 1; font: 700 38px/1.4 'Assistant', sans-serif; color: var(--magenta); margin: 0; font-size: 50px\">Advancing the process is not the same as advancing the decision.<\u002Fp>\n  <span style=\"position: absolute; bottom: 50px; right: 130px; font: 700 13px/1.4 'JetBrains Mono', monospace; letter-spacing: 2px; color: var(--text-on-dark-3); z-index: 1;\">05<\u002Fspan>\n<\u002Fsection>\n\n<section data-label=\"Conative AI\" data-speaker-notes=\"Introduce the name and the two-sided model before revealing Lybi.\" style=\"background: var(--dark); padding: 80px 120px; display: flex; flex-direction: column; position: relative;\">\n  <img src=\"4f0763ef-8569-4279-850a-30247a1b337b\" style=\"position: absolute; bottom: 34px; left: 120px; height: 22px; width: auto; opacity: .55; z-index: 1;\" alt=\"Lybi\">\n  <span style=\"font: 700 30px/1.4 'JetBrains Mono', monospace; letter-spacing: 4px; color: var(--pink-light);\">THE NEXT GENERATION<\u002Fspan>\n  <h2 style=\"font: 300 62px/1.3 'Assistant', sans-serif; color: #fff; max-width: 1600px; margin: 26px 0 68px;\">What's missing isn't a smarter agent- It's a <b><b>new<\u002Fb> <b>kind of intelligence<\u002Fb><\u002Fb> -&nbsp;<b style=\"font-weight: 800; color: var(--surface-card)\"><span style=\"font-weight: normal;\">one built around the<\u002Fspan> customer's decision.<\u002Fb><\u002Fh2>\n  <div style=\"display: flex; align-items: center; gap: 0; flex: 1;\">\n    <div style=\"flex: 1;\">\n      <div style=\"font: 700 18px/1.2 'Assistant', sans-serif; letter-spacing: 2px; color: var(--text-on-dark-2); text-transform: uppercase; margin-bottom: 20px; font-size: 40px\">The Customer<\u002Fdiv>\n      <div style=\"font: 400 32px/1.45 'Assistant', sans-serif; color: #fff; font-size: 35px\">What must become true for the customer to decide<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font: 300 50px/1 'Assistant', sans-serif; color: var(--text-on-dark-3); padding: 0 32px;\">→<\u002Fdiv>\n    <div style=\"flex: 1.1; text-align: center; padding: 0 20px;\">\n      <div style=\"font: 700 18px/1.2 'Assistant', sans-serif; letter-spacing: 2px; color: var(--pink-light); text-transform: uppercase; margin-bottom: 20px;\">We call it<\u002Fdiv>\n      <div style=\"font: 800 76px/1 'Assistant', sans-serif; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 24px;\">Conative AI<\u002Fdiv>\n      <div style=\"font: 400 24px/1.55 'Assistant', sans-serif; color: var(--text-on-dark-2); font-size: 40px\">Connects what shapes the decision with the value the organization can responsibly provide.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font: 300 50px/1 'Assistant', sans-serif; color: var(--text-on-dark-3); padding: 0 32px;\">←<\u002Fdiv>\n    <div style=\"flex: 1; text-align: right;\">\n      <div style=\"font: 700 18px/1.2 'Assistant', sans-serif; letter-spacing: 2px; color: var(--text-on-dark-2); text-transform: uppercase; margin-bottom: 20px; font-size: 40px; text-align: left\">The Organization<\u002Fdiv>\n      <div style=\"font: 400 32px/1.45 'Assistant', sans-serif; color: #fff; font-size: 36px; text-align: left\">The value it can responsibly provide<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"font: 400 24px/1.55 'Assistant', sans-serif; color: var(--magenta); border-top: 1px solid var(--line-on-dark); padding-top: 36px; margin-top: 36px; font-size: 50px; font-weight: 700\">Agentic AI expands what the organization can do. <br>Conative AI connects that capability to how the customer decides.<\u002Fdiv>\n  <span style=\"position: absolute; bottom: 34px; right: 120px; font: 700 13px/1.4 'JetBrains Mono', monospace; letter-spacing: 2px; color: var(--text-on-dark-3);\">06<\u002Fspan>\n<\u002Fsection>\n\n<section data-label=\"What is Lybi\" data-speaker-notes=\"First mention of the product name. Define it by what it is not.\" style=\"background: var(--dark); padding: 90px 130px; display: flex; flex-direction: column; justify-content: center; gap: 40px; position: relative; overflow: hidden;\">\n  <img src=\"4f0763ef-8569-4279-850a-30247a1b337b\" style=\"position: absolute; bottom: 50px; left: 130px; height: 22px; width: auto; opacity: .55; z-index: 2;\" alt=\"Lybi\">\n  <div style=\"position: absolute; left: -200px; bottom: -220px;\">\n    <x-import component-from-global-scope=\"LybiDesignSystem_fd38ba.Spiral\" size=\"560\" color=\"#1E1040\" hint-size=\"560px,560px\"><\u002Fx-import>\n  <\u002Fdiv>\n  <div style=\"position: relative; z-index: 1; display: flex; align-items: center; gap: 12px;\"><span style=\"width: 26px; height: 3px; background: var(--grad); display: inline-block;\"><\u002Fspan><span style=\"font: 700 30px/1.4 'JetBrains Mono', monospace; letter-spacing: 4px; color: var(--pink-light);\">WHAT IS LYBI<\u002Fspan><\u002Fdiv>\n  <h2 style=\"position: relative; z-index: 1; font: 300 66px/1.3 'Assistant', sans-serif; color: var(--surface-card); max-width: 1600px; margin: 0;\">Meet <b style=\"font-weight: 800;\">Lybi<\u002Fb>&nbsp;Conative AI - A Decision Catalyst Platform.<\u002Fh2>\n  <p style=\"position: relative; z-index: 1; font: 400 45px/1.55 'Assistant', sans-serif; color: var(--text-on-dark-2); max-width: 1500px; margin: 0;\">It composes the customer's decision path, assembles the value, and establishes the conditions that enable the customer to reach an informed decision, and act.<\u002Fp>\n  <div style=\"position: relative; z-index: 1; width: 140px; height: 4px; background: var(--grad);\"><\u002Fdiv>\n  <p style=\"position: relative; z-index: 1; font: 400 50px/1.5 'Assistant', sans-serif; color: var(--text-on-dark-3); max-width: 1500px; margin: 0;\">Not a more empathetic chat. Not a conversational wrapper over old decision trees.<\u002Fp>\n  <p style=\"position: relative; z-index: 1; font: 700 70px/1.4 'Assistant', sans-serif; color: var(--magenta); margin: 0;\">A platform built around the decision itself.<\u002Fp>\n  <span style=\"position: absolute; bottom: 50px; right: 130px; font: 700 13px/1.4 'JetBrains Mono', monospace; letter-spacing: 2px; color: var(--text-on-dark-3); z-index: 1;\">07<\u002Fspan>\n<\u002Fsection>\n\n<section data-label=\"Inside the platform\" data-speaker-notes=\"Hover each engine to reveal what it does. Walk the three engines around the live decision state.\" style=\"background: var(--dark); padding: 70px 120px; display: flex; flex-direction: column; position: relative;\">\n  <img src=\"4f0763ef-8569-4279-850a-30247a1b337b\" style=\"position: absolute; bottom: 34px; left: 120px; height: 22px; width: auto; opacity: .55; z-index: 1;\" alt=\"Lybi\">\n  <h2 style=\"font: 800 48px/1.2 'Assistant', sans-serif; color: #fff; margin: 0 0 14px;\">Inside the Decision Catalyst Platform<\u002Fh2>\n  <p style=\"font: 400 42px/1.35 'Assistant', sans-serif; color: var(--text-on-dark-2); max-width: 1700px; margin: 0;\">The customer's decision becomes the system's live operating model. <b style=\"color: #fff; font-weight: 700;\">The path, value, and conditions adapt around it.<\u002Fb><\u002Fp>\n  <div style=\"position: relative; flex: 1; margin-top: 10px;\">\n    <svg sc-camel-view-box=\"0 0 1000 560\" sc-camel-preserve-aspect-ratio=\"none\" style=\"position: absolute; inset: 0; width: 100%; height: 100%;\">\n      <line x1=\"500\" y1=\"300\" x2=\"190\" y2=\"120\" stroke=\"rgba(255,255,255,.25)\" stroke-width=\"1.5\" stroke-dasharray=\"4 5\"><\u002Fline>\n      <line x1=\"500\" y1=\"300\" x2=\"810\" y2=\"120\" stroke=\"rgba(255,255,255,.25)\" stroke-width=\"1.5\" stroke-dasharray=\"4 5\"><\u002Fline>\n      <line x1=\"500\" y1=\"300\" x2=\"500\" y2=\"500\" stroke=\"rgba(255,255,255,.25)\" stroke-width=\"1.5\" stroke-dasharray=\"4 5\"><\u002Fline>\n      <circle cx=\"190\" cy=\"120\" r=\"6\" fill=\"var(--pink)\"><\u002Fcircle>\n      <circle cx=\"810\" cy=\"120\" r=\"6\" fill=\"var(--pink)\"><\u002Fcircle>\n      <circle cx=\"500\" cy=\"500\" r=\"6\" fill=\"var(--pink)\"><\u002Fcircle>\n      <circle r=\"5\" fill=\"#fff\"><animateMotion dur=\"2.4s\" sc-camel-repeat-count=\"indefinite\" path=\"M500,300 L190,120 L500,300\"><\u002FanimateMotion><\u002Fcircle>\n      <circle r=\"5\" fill=\"#fff\"><animateMotion dur=\"2.4s\" begin=\"0.4s\" sc-camel-repeat-count=\"indefinite\" path=\"M500,300 L810,120 L500,300\"><\u002FanimateMotion><\u002Fcircle>\n      <circle r=\"5\" fill=\"#fff\"><animateMotion dur=\"2.4s\" begin=\"0.8s\" sc-camel-repeat-count=\"indefinite\" path=\"M500,300 L500,500 L500,300\"><\u002FanimateMotion><\u002Fcircle>\n    <\u002Fsvg>\n    <div style=\"position: absolute; left: 50%; top: 54%; width: 560px; height: 420px; transform: translate(-50%, -50%);\">\n      <div style=\"position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle, rgba(224,25,138,.5), rgba(91,30,138,.22) 70%, transparent 100%); animation: pulseGlow 2s ease-in-out infinite; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 50px;\">\n        <span style=\"font: 700 16px/1.4 'JetBrains Mono', monospace; letter-spacing: 3px; color: #fff; margin-bottom: 14px;\">LIVE DECISION STATE<\u002Fspan>\n        <span style=\"font: 700 40px/1.3 'Assistant', sans-serif; color: #fff;\">What is governing the decision now — and what's still missing for progress.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div sc-camel-on-mouse-enter=\"{{ onEnterPC }}\" sc-camel-on-mouse-leave=\"{{ onLeave }}\" style=\"position: absolute; left: 19%; top: 21%; transform: translate(-50%, -100%); text-align: center; width: 420px; cursor: pointer;\">\n      <div style=\"font: 800 42px/1.2 'Assistant', sans-serif; color: #fff;\">Path Composer Engine<\u002Fdiv>\n      <div style=\"{{ descStylePC }}\"><div style=\"font: 400 40px/1.35 'Assistant', sans-serif; color: var(--text-on-dark-2); padding-top: 12px;\">Composes what to explore or make visible next<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div sc-camel-on-mouse-enter=\"{{ onEnterVA }}\" sc-camel-on-mouse-leave=\"{{ onLeave }}\" style=\"position: absolute; left: 81%; top: 21%; transform: translate(-50%, -100%); text-align: center; width: 420px; cursor: pointer;\">\n      <div style=\"font: 800 42px/1.2 'Assistant', sans-serif; color: #fff;\">Value Assembler Engine<\u002Fdiv>\n      <div style=\"{{ descStyleVA }}\"><div style=\"font: 400 40px/1.35 'Assistant', sans-serif; color: var(--text-on-dark-2); padding-top: 12px;\">Assembles value around what matters to this customer<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div sc-camel-on-mouse-enter=\"{{ onEnterPG }}\" sc-camel-on-mouse-leave=\"{{ onLeave }}\" style=\"position: absolute; left: 50%; top: 89%; transform: translate(-50%, 0); text-align: center; width: 460px; cursor: pointer;\">\n      <div style=\"font: 800 42px/1.2 'Assistant', sans-serif; color: #fff;\">Progress Governor Engine<\u002Fdiv>\n      <div style=\"{{ descStylePG }}\"><div style=\"font: 400 40px/1.35 'Assistant', sans-serif; color: var(--text-on-dark-2); padding-top: 12px;\">Governs whether and how to progress<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <span style=\"position: absolute; bottom: 34px; right: 120px; font: 700 13px/1.4 'JetBrains Mono', monospace; letter-spacing: 2px; color: var(--text-on-dark-3);\">08<\u002Fspan>\n<\u002Fsection>\n\n<section data-label=\"Brain in action\" data-speaker-notes=\"Placeholder — swap in the real system-view capture before presenting.\" style=\"background: var(--dark); padding: 90px 130px; display: flex; flex-direction: column; justify-content: space-between; align-items: center; position: relative;\">\n  <img src=\"4f0763ef-8569-4279-850a-30247a1b337b\" style=\"position: absolute; bottom: 50px; left: 130px; height: 22px; width: auto; opacity: .55; z-index: 1;\" alt=\"Lybi\">\n  <span style=\"font: 700 30px/1.4 'JetBrains Mono', monospace; letter-spacing: 4px; color: var(--pink-light); margin-bottom: 30px;\">LIVE SYSTEM VIEW<\u002Fspan>\n  <h2 style=\"font: 300 64px/1.28 'Assistant', sans-serif; color: #fff; margin: 0 0 56px; text-align: center;\">Lybi's <b style=\"font-weight: 800;\">brain in action.<\u002Fb><\u002Fh2>\n  <div style=\"width: 100%; max-width: 1650px; height: 620px; border: 1px dashed var(--line-on-dark); border-radius: 16px; display: flex; align-items: center; justify-content: center;\">\n    <span style=\"font: 700 13px/1.4 'JetBrains Mono', monospace; color: var(--text-on-dark-3); letter-spacing: 2px; font-size: 60px\">LIVE SYSTEM VIEW TO BE ADDED<\u002Fspan>\n  <\u002Fdiv>\n  <span style=\"position: absolute; bottom: 50px; right: 130px; font: 700 13px/1.4 'JetBrains Mono', monospace; letter-spacing: 2px; color: var(--text-on-dark-3);\">09<\u002Fspan>\n<\u002Fsection>\n\n<section data-label=\"Demo bridge\" data-speaker-notes=\"Bridge into the live demo of three concurrent customers.\" style=\"background: var(--dark); padding: 90px 130px; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden;\">\n  <img src=\"4f0763ef-8569-4279-850a-30247a1b337b\" style=\"position: absolute; bottom: 50px; left: 130px; height: 22px; width: auto; opacity: .55; z-index: 1;\" alt=\"Lybi\">\n  <span style=\"position: absolute; right: 40px; bottom: -130px; font: 800 560px/1 'Assistant', sans-serif; color: rgba(255,255,255,.035); pointer-events: none;\">10<\u002Fspan>\n  <div style=\"position: relative; z-index: 1; display: flex; align-items: center; gap: 12px; margin-bottom: 40px;\"><span style=\"width: 26px; height: 3px; background: var(--grad); display: inline-block;\"><\u002Fspan><span style=\"font: 700 30px/1.4 'JetBrains Mono', monospace; letter-spacing: 4px; color: var(--pink-light);\">LIVE FROM THE PLATFORM<\u002Fspan><\u002Fdiv>\n  <h2 style=\"position: relative; z-index: 1; font: 300 64px/1.3 'Assistant', sans-serif; color: #fff; max-width: 1600px; margin: 0 0 48px;\">Same journey. Three customers. <b style=\"font-weight: 800;\">Three different decisions in motion.<\u002Fb><\u002Fh2>\n  <p style=\"position: relative; z-index: 1; font: 400 32px/1.55 'Assistant', sans-serif; color: var(--text-on-dark-2); max-width: 1500px; margin: 0 0 48px; font-size: 40px\">Watch Lybi create a different path, value rationale, set of conditions, and next move for each customer.<\u002Fp>\n  <div style=\"position: relative; z-index: 1; width: 140px; height: 4px; background: var(--grad); margin-bottom: 44px;\"><\u002Fdiv>\n  <p style=\"position: relative; z-index: 1; font: 700 38px/1.4 'Assistant', sans-serif; color: #fff; margin: 0; font-size: 45px\">The customer sees one conversation. The decision system underneath is never the same.<\u002Fp>\n  <span style=\"position: absolute; bottom: 50px; right: 130px; font: 700 13px/1.4 'JetBrains Mono', monospace; letter-spacing: 2px; color: var(--text-on-dark-3); z-index: 1;\">10<\u002Fspan>\n<\u002Fsection>\n\n<section data-label=\"What you are buying\" data-speaker-notes=\"Reframe from demo to product: this is a configurable solution.\" style=\"background: var(--dark); padding: 90px 130px; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden;\">\n  <img src=\"4f0763ef-8569-4279-850a-30247a1b337b\" style=\"position: absolute; bottom: 50px; left: 130px; height: 22px; width: auto; opacity: .55; z-index: 1;\" alt=\"Lybi\">\n  <span style=\"position: absolute; right: 40px; bottom: -130px; font: 800 560px/1 'Assistant', sans-serif; color: rgba(255,255,255,.035); pointer-events: none;\">11<\u002Fspan>\n  <div style=\"position: relative; z-index: 1; display: flex; align-items: center; gap: 12px; margin-bottom: 40px;\"><span style=\"width: 26px; height: 3px; background: var(--grad); display: inline-block;\"><\u002Fspan><span style=\"font: 700 30px/1.4 'JetBrains Mono', monospace; letter-spacing: 4px; color: var(--pink-light);\">WHAT YOU JUST SAW<\u002Fspan><\u002Fdiv>\n  <h2 style=\"position: relative; z-index: 1; font: 300 64px/1.3 'Assistant', sans-serif; color: #fff; max-width: 1500px; margin: 0 0 48px;\">More than a platform. <b style=\"font-weight: 800; color: var(--pink-dark)\">A banking-ready solution.<\u002Fb><\u002Fh2>\n  <p style=\"position: relative; z-index: 1; font: 400 32px/1.55 'Assistant', sans-serif; color: var(--text-on-dark-2); max-width: 1500px; margin: 0 0 56px; font-size: 40px\">We productize decades of banking expertise into configurable solutions for high-value banking journeys.<\u002Fp>\n  <div style=\"position: relative; z-index: 1; display: flex; flex-wrap: wrap; gap: 16px 34px; margin-bottom: 56px;\">\n    <span style=\"font: 500 26px/1.4 'Assistant', sans-serif; color: #fff; padding: 8px 0; font-size: 40px\">Decision models<\u002Fspan><span style=\"color: var(--text-on-dark-3); padding: 8px 0;\">·<\u002Fspan>\n    <span style=\"font: 500 26px/1.4 'Assistant', sans-serif; color: #fff; padding: 8px 0; font-size: 40px\">Diagnostic paths<\u002Fspan><span style=\"color: var(--text-on-dark-3); padding: 8px 0;\">·<\u002Fspan>\n    <span style=\"font: 500 26px/1.4 'Assistant', sans-serif; color: #fff; padding: 8px 0; font-size: 40px\">Journey logic<\u002Fspan><span style=\"color: var(--text-on-dark-3); padding: 8px 0;\">·<\u002Fspan>\n    <span style=\"font: 500 26px/1.4 'Assistant', sans-serif; color: #fff; padding: 8px 0; font-size: 40px\">Value rules<\u002Fspan><span style=\"color: var(--text-on-dark-3); padding: 8px 0;\">·<\u002Fspan>\n    <span style=\"font: 500 26px/1.4 'Assistant', sans-serif; color: #fff; padding: 8px 0; font-size: 40px\">Response policies<\u002Fspan><span style=\"color: var(--text-on-dark-3); padding: 8px 0;\">·<\u002Fspan>\n    <span style=\"font: 500 26px/1.4 'Assistant', sans-serif; color: #fff; padding: 8px 0; font-size: 40px\">Regulatory boundaries<\u002Fspan><span style=\"color: var(--text-on-dark-3); padding: 8px 0;\">·<\u002Fspan>\n    <span style=\"font: 500 26px/1.4 'Assistant', sans-serif; color: #fff; padding: 8px 0; font-size: 40px\">Evaluation sets<\u002Fspan>\n  <\u002Fdiv>\n  <p style=\"position: relative; z-index: 1; font: 700 34px/1.4 'Assistant', sans-serif; color: var(--magenta); margin: 0; font-size: 40px\">Ready to customize. Designed for rapid, governed deployment.<\u002Fp>\n  <span style=\"position: absolute; bottom: 50px; right: 130px; font: 700 13px/1.4 'JetBrains Mono', monospace; letter-spacing: 2px; color: var(--text-on-dark-3); z-index: 1;\">11<\u002Fspan>\n<\u002Fsection>\n\n<section data-label=\"The business case\" data-speaker-notes=\"Tie the whole argument back to the top line.\" style=\"background: var(--dark); padding: 90px 130px; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden;\">\n  <img src=\"4f0763ef-8569-4279-850a-30247a1b337b\" style=\"position: absolute; bottom: 50px; left: 130px; height: 22px; width: auto; opacity: .55; z-index: 1;\" alt=\"Lybi\">\n  <span style=\"position: absolute; right: 40px; bottom: -130px; font: 800 560px/1 'Assistant', sans-serif; color: rgba(255,255,255,.035); pointer-events: none;\">12<\u002Fspan>\n  <div style=\"position: relative; z-index: 1; display: flex; align-items: center; gap: 12px; margin-bottom: 40px;\"><span style=\"width: 26px; height: 3px; background: var(--grad); display: inline-block;\"><\u002Fspan><span style=\"font: 700 30px/1.4 'JetBrains Mono', monospace; letter-spacing: 4px; color: var(--pink-light);\">THE BUSINESS CASE<\u002Fspan><\u002Fdiv>\n  <h2 style=\"position: relative; z-index: 1; font: 300 50px/1.42 'Assistant', sans-serif; color: var(--white); max-width: 1650px; margin: 0 0 56px; font-size: 60px\"><b><b style=\"color: var(--pink-dark);\">In high-value customer journeys -&nbsp;<\u002Fb><\u002Fb>where a customer decision shapes the business outcome, the journey must be designed <b style=\"font-weight: 800; color: var(--pink-dark);\">around the decision, not just the process.<\u002Fb><\u002Fh2>\n  <div style=\"position: relative; z-index: 1; display: flex; align-items: center; gap: 34px; margin-bottom: 56px; flex-wrap: wrap;\">\n    <span style=\"font: 400 36px/1.3 'Assistant', sans-serif; color: var(--surface-card); font-size: 45px; font-weight: 700\">Transactional flows<\u002Fspan>\n    <span style=\"font: 300 42px/1 'Assistant', sans-serif; color: var(--pink-light);\">→<\u002Fspan>\n    <span style=\"font: 700 38px/1.3 'Assistant', sans-serif; color: #fff; font-size: 45px\">Decision journeys<\u002Fspan>\n  <\u002Fdiv>\n  <p style=\"position: relative; z-index: 1; font: 400 28px/1.55 'Assistant', sans-serif; color: var(--text-on-dark-2); max-width: 1350px; margin: 0 0 44px; font-size: 45px\">Catalyzing progress toward informed action and unlocking the business value that depends on it.<\u002Fp>\n  <div style=\"position: relative; z-index: 1; width: 140px; height: 4px; background: var(--grad); margin-bottom: 44px;\"><\u002Fdiv>\n  <p style=\"position: relative; z-index: 1; font: 700 38px/1.4 'Assistant', sans-serif; color: var(--magenta); margin: 0; font-size: 80px\">And this is where your AI investment meets the top line.<\u002Fp>\n  <span style=\"position: absolute; bottom: 50px; right: 130px; font: 700 13px/1.4 'JetBrains Mono', monospace; letter-spacing: 2px; color: var(--text-on-dark-3); z-index: 1;\">12<\u002Fspan>\n<\u002Fsection>\n\n<section data-label=\"The next step\" data-speaker-notes=\"Close with a concrete, low-friction ask.\" style=\"background: var(--dark); padding: 90px 130px; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden;\">\n  <img src=\"4f0763ef-8569-4279-850a-30247a1b337b\" style=\"position: absolute; bottom: 50px; left: 130px; height: 22px; width: auto; opacity: .55; z-index: 1;\" alt=\"Lybi\">\n  <div style=\"position: absolute; right: -200px; bottom: -200px;\">\n    <x-import component-from-global-scope=\"LybiDesignSystem_fd38ba.Spiral\" size=\"560\" color=\"#1E1040\" hint-size=\"560px,560px\"><\u002Fx-import>\n  <\u002Fdiv>\n  <div style=\"position: relative; z-index: 1; display: flex; align-items: center; gap: 12px; margin-bottom: 40px;\"><span style=\"width: 26px; height: 3px; background: var(--grad); display: inline-block;\"><\u002Fspan><span style=\"font: 700 30px/1.4 'JetBrains Mono', monospace; letter-spacing: 4px; color: var(--pink-light); font-size: 40px\">THE NEXT STEP<\u002Fspan><\u002Fdiv>\n  <h2 style=\"position: relative; z-index: 1; font: 300 84px/1.15 'Assistant', sans-serif; color: #fff; margin: 0 0 64px;\">Let's assess <b style=\"font-weight: 800;\">one journey.<\u002Fb><\u002Fh2>\n  <div style=\"position: relative; z-index: 1; font: 700 15px/1.4 'JetBrains Mono', monospace; letter-spacing: 2px; color: var(--text-on-dark-2); text-transform: uppercase; margin-bottom: 26px; font-size: 40px\">High-value banking use cases<\u002Fdiv>\n  <div style=\"position: relative; z-index: 1; display: flex; gap: 56px; margin-bottom: 72px; flex-wrap: wrap;\">\n    <span style=\"font: 500 42px/1.2 'Assistant', sans-serif; color: #fff;\">Onboarding<\u002Fspan>\n    <span style=\"font: 300 42px/1.2 'Assistant', sans-serif; color: var(--text-on-dark-3);\">·<\u002Fspan>\n    <span style=\"font: 500 42px/1.2 'Assistant', sans-serif; color: #fff;\">Credit<\u002Fspan>\n    <span style=\"font: 300 42px/1.2 'Assistant', sans-serif; color: var(--text-on-dark-3);\">·<\u002Fspan>\n    <span style=\"font: 500 42px/1.2 'Assistant', sans-serif; color: #fff;\">Mortgages<\u002Fspan>\n    <span style=\"font: 300 42px/1.2 'Assistant', sans-serif; color: var(--text-on-dark-3);\">·<\u002Fspan>\n    <span style=\"font: 500 42px/1.2 'Assistant', sans-serif; color: #fff;\">Loans<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"position: relative; z-index: 1;\">\n    <x-import component-from-global-scope=\"LybiDesignSystem_fd38ba.Button\" variant=\"primary\" size=\"lg\" hint-size=\"320px,68px\">Schedule the assessment<\u002Fx-import>\n  <\u002Fdiv>\n  <span style=\"position: absolute; bottom: 50px; right: 130px; font: 700 13px/1.4 'JetBrains Mono', monospace; letter-spacing: 2px; color: var(--text-on-dark-3); z-index: 1;\">13<\u002Fspan>\n<\u002Fsection>\n\n<section data-label=\"Backup\" data-speaker-notes=\"Divider before backup material — skip in the main run unless asked.\" style=\"background: var(--dark); padding: 90px 130px; display: flex; flex-direction: column; justify-content: space-between; align-items: center; text-align: center; position: relative; overflow: hidden;\">\n  <img src=\"4f0763ef-8569-4279-850a-30247a1b337b\" style=\"position: absolute; bottom: 50px; left: 130px; height: 22px; width: auto; opacity: .55; z-index: 1;\" alt=\"Lybi\">\n  <span style=\"position: absolute; right: 0; bottom: -160px; font: 800 620px/1 'Assistant', sans-serif; color: rgba(255,255,255,.03); pointer-events: none;\">14<\u002Fspan>\n  <div style=\"position: relative; z-index: 1; width: 100%; display: flex; justify-content: center;\">\n    <span style=\"font: 700 30px/1.4 'JetBrains Mono', monospace; letter-spacing: 4px; color: var(--pink-light);\">APPENDIX<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 40px;\">\n    <div style=\"width: 140px; height: 4px; background: var(--grad);\"><\u002Fdiv>\n    <h2 style=\"font: 300 140px/1 'Assistant', sans-serif; color: #fff; margin: 0;\">Backup<\u002Fh2>\n    <div style=\"width: 140px; height: 4px; background: var(--grad);\"><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 24px;\">\n    <p style=\"font: 400 32px/1.5 'Assistant', sans-serif; color: var(--text-on-dark-2); margin: 0;\">Use cases · Technical appendix<\u002Fp>\n    <span style=\"font: 700 13px/1.4 'JetBrains Mono', monospace; letter-spacing: 2px; color: var(--text-on-dark-3);\">14<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fx-import>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { hovered: null };\n  renderVals() {\n    const mk = (key) => ({\n      opacity: this.state.hovered === key ? 1 : 0,\n      maxHeight: this.state.hovered === key ? 160 : 0,\n      overflow: 'hidden',\n      transition: 'opacity .25s ease, max-height .25s ease',\n    });\n    return {\n      descStylePC: mk('pc'),\n      descStyleVA: mk('va'),\n      descStylePG: mk('pg'),\n      onEnterPC: () => this.setState({ hovered: 'pc' }),\n      onEnterVA: () => this.setState({ hovered: 'va' }),\n      onEnterPG: () => this.setState({ hovered: 'pg' }),\n      onLeave: () => this.setState({ hovered: null }),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
