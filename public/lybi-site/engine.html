  The Conative Engine, v2. Same story as the handed-off animation (Hila's
  selected engine), told with painted art:
    an interaction arrives → the orbit rings catch it (sensing) → it is carried
    into the Live Decision State → the state fans out to Drivers, Value and
    Conditions → an upward signal adds the next Decision Path segment.
  Every interaction updates the Decision Path; only the 3rd and 6th also
  advance the Process. Six interactions per loop, ~57 s at the 0.6 multiplier.
  Art (Leonardo, GPT Image 2.5): backdrop + two glass spheres, as separate
  layers so each sphere can glow and breathe on its own. Labels are live text.

var backdrop=img('/lybi-site/assets/engine-backdrop.39cee7c037.webp'),coreImg=img('/lybi-site/assets/engine-core.fcf3c1e581.webp'),satImg=img('/lybi-site/assets/engine-satellite.ae54ef0ff2.webp');

var clamp=function(x){return Math.max(0,Math.min(1,x))},ease=function(x){x=clamp(x);return x*x*(3-2*x)};
var easeOut=function(x){x=clamp(x);return 1-Math.pow(1-x,3)},mod=function(v,n){return (v%n+n)%n};
var bell=function(x){return x<=0||x>=1?0:Math.sin(Math.PI*x)};

/* ---------- Geometry ---------- */
var ORB={x:836,y:600};                                   // orbit centre
var RINGS=[760,690,612,528,438].map(function(rx){return {rx:rx,ry:rx*0.235}});
var CORE={x:836,y:478,r:150,name:['Live','Decision','State']};
var SATS=[
 {x:332,y:512,r:96,name:'Drivers',verb:'DISCOVERS'},
 {x:1340,y:512,r:96,name:'Value',verb:'ASSEMBLES'},
 {x:836,y:752,r:88,name:'Conditions',verb:'ESTABLISHES'}
];
function bez(a,b,c,d,n){n=n||90;var out=[];for(var i=0;i<=n;i++){var t=i/n,u=1-t;out.push([u*u*u*a[0]+3*u*u*t*b[0]+3*u*t*t*c[0]+t*t*t*d[0],u*u*u*a[1]+3*u*u*t*b[1]+3*u*t*t*c[1]+t*t*t*d[1]])}return out}
var BRIDGES=[
 bez([CORE.x-CORE.r*.92,CORE.y+20],[700,560],[520,540],[SATS[0].x+SATS[0].r*.95,SATS[0].y]),
 bez([CORE.x+CORE.r*.92,CORE.y+20],[972,560],[1152,540],[SATS[1].x-SATS[1].r*.95,SATS[1].y]),
 bez([CORE.x,CORE.y+CORE.r*.96],[CORE.x-14,CORE.y+CORE.r+18],[CORE.x+14,SATS[2].y-SATS[2].r-18],[CORE.x,SATS[2].y-SATS[2].r*.96],40)
];
function ringPoint(k,a){var r=RINGS[k];return [ORB.x+r.rx*Math.cos(a),ORB.y+r.ry*Math.sin(a)]}

/* ---------- Story ---------- */
// Every interaction updates the decision path; the 3rd and 6th also advance the process.
var EVENTS=[
 {at:.4,angle:2.75,process:false},{at:5.5,angle:.35,process:false},{at:10.6,angle:3.55,process:true},
 {at:15.7,angle:1.2,process:false},{at:20.8,angle:2.3,process:false},{at:25.9,angle:5.9,process:true}
];
var UPDATE=4.2,GROW=1.1;
var TRACK={x0:300,process:110,decision:198};
var PROCESS_STEPS=[330,400];
var OUTS=[{dx:150,dy:-26},{dx:182,dy:44},{dx:160,dy:-46},{dx:190,dy:34},{dx:176,dy:-30},{dx:182,dy:24}];
function processNodes(t){var n=[{x:TRACK.x0,y:TRACK.process,u:1}],x=TRACK.x0,i=0;
 EVENTS.forEach(function(e){if(!e.process)return;var age=t-e.at-UPDATE;if(age<0)return;x+=PROCESS_STEPS[i++];n.push({x:x,y:TRACK.process,u:clamp(age/GROW)})});return n}
function decisionNodes(t){var n=[{x:TRACK.x0,y:TRACK.decision,u:1}];
 for(var i=0;i<EVENTS.length;i++){var age=t-EVENTS[i].at-UPDATE;if(age<0)break;var last=n[n.length-1],o=OUTS[i];
  n.push({x:last.x+o.dx,y:Math.max(150,Math.min(240,last.y+o.dy)),u:clamp(age/GROW)})}return n}
function frontier(kind,i){var t=EVENTS[i].at+UPDATE-.01,n=kind==='p'?processNodes(t):decisionNodes(t);return n[n.length-1]}
function phaseAt(t){var ph=-1;EVENTS.forEach(function(e){var p=t-e.at;if(p>=0&&p<.9)ph=0;else if(p>=.9&&p<2.2)ph=1;else if(p>=2.2&&p<2.95)ph=2;else if(p>=2.95&&p<3.9)ph=3;else if(p>=3.9&&p<UPDATE+GROW)ph=4});return ph}

/* ---------- Drawing helpers ---------- */
function glow(x,y,r,a,core){if(a<=0)return;ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=a;
 var g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,core||'rgba(255,255,255,1)');g.addColorStop(.18,'rgba(228,211,255,.9)');g.addColorStop(.45,'rgba(174,128,255,.45)');g.addColorStop(1,'rgba(123,57,197,0)');
 ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);ctx.restore()}
function line(pts,a,w,color,blur){if(pts.length<2||a<=0)return;ctx.save();ctx.globalAlpha=a;ctx.strokeStyle=color||C.lilac;ctx.lineWidth=w||2;ctx.lineCap='round';ctx.lineJoin='round';
 if(blur){ctx.shadowBlur=blur;ctx.shadowColor=C.radiant}ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(var i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.stroke();ctx.restore()}
function at(pts,u){return pts[Math.round(clamp(u)*(pts.length-1))]}
// A packet of light travelling along a path, with a fading tail.
function packet(pts,u,a){if(u<=0||u>=1)return;a=a==null?1:a;var end=Math.round(u*(pts.length-1)),tail=Math.max(0,end-16);
 for(var i=tail;i<end;i++)line([pts[i],pts[i+1]],a*(i-tail)/16,3.2,C.pale,8);var p=pts[end];glow(p[0],p[1],22,a)}
function ellipsePts(k,a0,a1,n){var out=[];n=n||120;for(var i=0;i<=n;i++)out.push(ringPoint(k,a0+(a1-a0)*i/n));return out}

/* ---------- Scene layers ---------- */
var dust=[];for(var i=0;i<110;i++)dust.push({x:Math.random()*W,y:Math.random()*H,r:.4+Math.random()*1.4,s:.15+Math.random()*.5,ph:Math.random()*TAU});
function drawBackdrop(time){
 ctx.fillStyle=C.night;ctx.fillRect(0,0,W,H);
 if(backdrop.complete&&backdrop.naturalWidth)ctx.drawImage(backdrop,0,0,W,H);
 // Keep the stage dark where text lives; light pools where the engine sits.
 var v=ctx.createRadialGradient(ORB.x,ORB.y-40,120,ORB.x,ORB.y,900);v.addColorStop(0,'rgba(16,11,27,0)');v.addColorStop(1,'rgba(16,11,27,.78)');ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
 var top=ctx.createLinearGradient(0,0,0,300);top.addColorStop(0,'rgba(16,11,27,.85)');top.addColorStop(1,'rgba(16,11,27,0)');ctx.fillStyle=top;ctx.fillRect(0,0,W,300);
 ctx.save();ctx.globalCompositeOperation='lighter';
 dust.forEach(function(d){var y=mod(d.y-time*d.s*14,H),a=.25+.25*Math.sin(time*.8+d.ph);ctx.globalAlpha=a;ctx.fillStyle=C.pale;ctx.beginPath();ctx.arc(d.x+Math.sin(time*.2+d.ph)*6,y,d.r,0,TAU);ctx.fill()});
 ctx.restore();
}
// Rings: back halves behind the spheres, front halves in front, for depth.
function drawRings(time,front){
 RINGS.forEach(function(r,k){
  var a0=front?0:Math.PI,a1=front?Math.PI:TAU;
  line(ellipsePts(k,a0,a1),front?.22:.14,k===0?1.3:1,C.lilac);
  // light travelling around each ring
  var speed=(k%2?-1:1)*(.05+k*.012),n=3;
  for(var j=0;j<n;j++){var a=mod(time*speed+j*TAU/n+k,TAU);var isFront=a<Math.PI;if(isFront!==front)continue;
   var seg=ellipsePts(k,a-.28,a,24);line(seg,.55,1.8,C.pale,6);var p=seg[seg.length-1];glow(p[0],p[1],10,.6)}
 });
}
function drawBridges(time){
 BRIDGES.forEach(function(b,i){line(b,.18,6,C.radiant,0);line(b,.35,1.2,C.lilac,4);
  var u=mod(time*.12+i*.33,1);var p=at(b,u);glow(p[0],p[1],9,.5)});
}
function drawOrb(o,image,boost,time,phase){
 var bob=Math.sin(time*.6+phase)*4,breathe=1+Math.sin(time*.9+phase)*.012+boost*.05,r=o.r*breathe,x=o.x,y=o.y+bob;
 // soft halo
 glow(x,y,r*1.9,.18+boost*.45,'rgba(174,128,255,.7)');
 if(image.complete&&image.naturalWidth){ctx.drawImage(image,x-r,y-r,r*2,r*2);
  if(boost>0){ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=boost*.75;ctx.drawImage(image,x-r,y-r,r*2,r*2);ctx.restore()}}
 return {x:x,y:y,r:r};
}
function ripple(o,p){if(p<=0||p>=1)return;ctx.save();ctx.globalAlpha=(1-p)*.8;ctx.strokeStyle=C.pale;ctx.lineWidth=2;ctx.shadowBlur=14;ctx.shadowColor=C.radiant;
 ctx.beginPath();ctx.arc(o.x,o.y,o.r*(1+p*.45),0,TAU);ctx.stroke();ctx.restore()}
function label(text,x,y,size,weight,color,align,spacing){ctx.save();ctx.font=(weight||600)+' '+size+'px Assistant, Arial, sans-serif';ctx.fillStyle=color;ctx.textAlign=align||'center';ctx.textBaseline='middle';
 if(spacing)ctx.letterSpacing=spacing+'px';ctx.shadowColor='rgba(16,11,27,.9)';ctx.shadowBlur=10;ctx.fillText(text,x,y);ctx.restore()}
function bubble(x,y,a,time){if(a<=0)return;ctx.save();ctx.translate(x,y);ctx.globalAlpha=a;
 ctx.shadowBlur=22;ctx.shadowColor=C.radiant;ctx.fillStyle='rgba(32,23,47,.92)';ctx.strokeStyle=C.lilac;ctx.lineWidth=1.8;
 ctx.beginPath();ctx.roundRect(-30,-19,60,38,10);ctx.fill();ctx.stroke();
 ctx.beginPath();ctx.moveTo(-10,19);ctx.lineTo(-17,29);ctx.lineTo(4,19);ctx.fill();ctx.stroke();ctx.shadowBlur=0;
 for(var i=-1;i<=1;i++){var b=Math.sin(time*7-i*.9)*2.5;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(i*12,b,3,0,TAU);ctx.fill()}
 ctx.restore()}

/* ---------- Process vs Decision Path ---------- */
function curveBetween(a,b){var dx=b.x-a.x;return bez([a.x,a.y],[a.x+dx*.42,a.y],[b.x-dx*.25,b.y],[b.x,b.y],60)}
function node(n,decision){var u=n.u;if(u<=0)return;var s=easeOut(u/.4);ctx.save();
 if(u<.5)for(var j=0;j<6;j++){var a=TAU*j/6+(1-s),rr=8+24*(1-s);glow(n.x+Math.cos(a)*rr,n.y+Math.sin(a)*rr,5,.8*(1-s))}
 ctx.fillStyle=C.night;ctx.strokeStyle=decision?C.pale:C.lilac;ctx.lineWidth=decision?2.4:1.8;ctx.shadowColor=C.radiant;ctx.shadowBlur=decision?14:6;
 ctx.beginPath();ctx.arc(n.x,n.y,(decision?7.5:6)*(.3+.7*s),0,TAU);ctx.fill();ctx.stroke();ctx.restore();if(u<1)glow(n.x,n.y,24,.6)}
function graph(nodes,decision){for(var i=1;i<nodes.length;i++){var n=nodes[i],u=ease((n.u-.3)/.7);if(u<=0)continue;var c=curveBetween(nodes[i-1],n),piece=c.slice(0,Math.max(2,Math.round(u*(c.length-1))+1));
  if(decision){line(piece,1,3.2,C.radiant,10);line(piece,.7,1,C.pale)}else line(piece,.85,1.8,C.lilac,4);if(u<1){var e=piece[piece.length-1];glow(e[0],e[1],13,.7)}}
 nodes.forEach(function(n){node(n,decision)})}
function drawTracks(t,fade){ctx.save();ctx.globalAlpha=fade;
 graph(processNodes(t),false);graph(decisionNodes(t),true);ctx.restore();
 label('Process',70,TRACK.process,26,600,'#fff','left');
 label('Decision Path',70,TRACK.decision,26,600,'#fff','left');
 // Counters: the whole point at a glance.
 var p=processNodes(t).filter(function(n){return n.u>0}).length-1,d=decisionNodes(t).filter(function(n){return n.u>0}).length-1;
 label(String(p),1600,TRACK.process,22,700,C.lilac,'right');label(String(d),1600,TRACK.decision,22,700,C.pale,'right');
}

/* ---------- Legend ---------- */
var PHASES=['INTERACTION','SENSING','DECISION STATE','DRIVERS · VALUE · CONDITIONS','DECISION PATH'];
function drawLegend(ph){label('Conative Engine',60,895,34,700,'#fff','left');
 ctx.save();ctx.font='700 14px Assistant, Arial, sans-serif';ctx.letterSpacing='1.6px';var gap=38,x=1612,ws=PHASES.map(function(s){return ctx.measureText(s).width});ctx.restore();
 for(var i=PHASES.length-1;i>=0;i--){x-=ws[i];var on=ph===i;label(PHASES[i],x,898,14,700,on?'#F3EAFF':'rgba(174,128,255,.55)','left',1.6);
  if(on){ctx.save();ctx.fillStyle=C.lilac;ctx.shadowBlur=10;ctx.shadowColor=C.radiant;ctx.fillRect(x,913,ws[i],2);ctx.restore()}x-=gap}}

/* ---------- One frame ---------- */
function render(time){
 var t=mod(time,DUR),fade=1-ease((t-32.4)/1.6),ph=phaseAt(t);
 // Gentle camera drift for depth.
 var cx=Math.sin(time*.07)*7,cy=Math.cos(time*.05)*4,zoom=1.012+Math.sin(time*.04)*.008;
 ctx.save();ctx.translate(W/2+cx,H/2+cy);ctx.scale(zoom,zoom);ctx.translate(-W/2,-H/2);
 drawBackdrop(time);
 drawRings(time,false);
 // What the interactions do to the engine this frame.
 var coreBoost=0,satBoost=[0,0,0],satRipple=[-1,-1,-1],coreRipple=-1;
 var overlays=[];
 EVENTS.forEach(function(e,idx){var p=t-e.at;if(p<0||p>5.8)return;
  var hit=ringPoint(0,e.angle),from=[ORB.x+(RINGS[0].rx+260)*Math.cos(e.angle),ORB.y+(RINGS[0].ry+300)*Math.sin(e.angle)-120];
  from=[Math.max(40,Math.min(W-40,from[0])),Math.max(330,Math.min(H-60,from[1]))];
  var arrive=bez(from,[from[0],from[1]-60],[hit[0]-(hit[0]>ORB.x?-40:40),hit[1]-30],hit,60);
  overlays.push(function(){
   if(p<1.05){var pt=at(arrive,easeOut(p/.9));bubble(pt[0],pt[1]-32,Math.min(1,p*4)*(1-ease((p-.85)/.2)),time)}
   // Sensing: the rings catch it and a scan sweeps outward from the impact.
   if(p>=.8&&p<2.2){var u=(p-.8)/1.4;glow(hit[0],hit[1],46,bell(u));
    for(var k=0;k<4;k++){var q=clamp(u*1.8-k*.16);if(q>0&&q<1){var a=e.angle+(hit[0]>ORB.x?-1:1)*q*.7;line(ellipsePts(k,a-.4,a+.4,40),bell(q)*.95,3.2,C.pale,10)}}}
   // Carried inward to the Live Decision State — never straight to a satellite.
   if(p>=1.35&&p<2.35){var tgt=[CORE.x+(hit[0]>ORB.x?1:-1)*CORE.r*.7,CORE.y+CORE.r*.55];
    packet(bez(hit,[hit[0]*.55+ORB.x*.45,hit[1]+10],[tgt[0]+(hit[0]>ORB.x?80:-80),tgt[1]+60],tgt,60),(p-1.35)/1,1)}
   // The state fans out to Drivers, Value and Conditions.
   for(var j=0;j<3;j++)packet(BRIDGES[j],(p-2.95-j*.1)/.7,1);
   // Only then does an upward signal add the next path segment (and sometimes a process step).
   if(p>=3.55&&p<UPDATE){var up=(p-3.55)/(UPDATE-3.55),df=frontier('d',idx);
    packet(bez([CORE.x,CORE.y-CORE.r],[CORE.x,CORE.y-CORE.r-80],[df.x,df.y+110],[df.x,df.y]),up,.95);
    if(e.process){var pf=frontier('p',idx);packet(bez([CORE.x,CORE.y-CORE.r],[CORE.x+90,CORE.y-CORE.r-120],[pf.x,pf.y+150],[pf.x,pf.y]),up,.7)}}
  });
  coreBoost=Math.max(coreBoost,bell((p-2.2)/.85));if(p>=2.25&&p<3.1)coreRipple=(p-2.25)/.85;
  for(var j=0;j<3;j++){var q=(p-3.5-j*.1)/.75;satBoost[j]=Math.max(satBoost[j],bell(q));if(q>0&&q<1)satRipple[j]=q}
 });
 drawBridges(time);
 var sats=SATS.map(function(s,i){return drawOrb(s,satImg,satBoost[i],time,i*1.7)});
 var core=drawOrb(CORE,coreImg,coreBoost,time,.6);
 // The state processing: sparks inside the core.
 if(coreBoost>0){for(var s=0;s<7;s++){var a=time*1.4+s*TAU/7,rr=CORE.r*(.25+.35*((s*37)%10)/10);glow(core.x+Math.cos(a)*rr,core.y+Math.sin(a)*rr*.8,14,coreBoost*.8)}}
 ripple(core,coreRipple);sats.forEach(function(o,i){ripple(o,satRipple[i])});
 drawRings(time,true);
 overlays.forEach(function(f){f()});
 // Labels: live text, centred in each sphere; verbs above the satellites.
 label(CORE.name[0],core.x,core.y-26,24,700,'#fff');label(CORE.name[1],core.x,core.y,24,700,'#fff');label(CORE.name[2],core.x,core.y+26,24,700,'#fff');
 sats.forEach(function(o,i){label(SATS[i].name,o.x,o.y,22,700,'#fff');
  label(SATS[i].verb,o.x,o.y-o.r-22,13,700,satBoost[i]>.05?'#F3EAFF':'rgba(174,128,255,.75)','center',2.4)});
 ctx.restore();
 drawTracks(t,fade);
 drawLegend(ph);
}

/* ---------- Loop ---------- */
function fit(){var dpr=Math.min(window.devicePixelRatio||1,2),w=canvas.clientWidth||W,h=canvas.clientHeight||H;
 canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);
 // Letterbox to keep the 1672x941 stage whole at any frame size.
 var s=Math.min(canvas.width/W,canvas.height/H);ctx.setTransform(s,0,0,s,(canvas.width-W*s)/2,(canvas.height-H*s)/2)}
var clock=0,last=0;
function frame(now){clock+=last?Math.min(.05,(now-last)/1000)*SPEED:0;last=now;fit();render(clock);if(!document.hidden)requestAnimationFrame(frame);else last=0}
document.addEventListener('visibilitychange',function(){if(!document.hidden&&!REDUCED&&FIXED==null){last=0;requestAnimationFrame(frame)}});
window.addEventListener('resize',function(){fit();if(REDUCED||FIXED!=null)render(FIXED!=null?FIXED:31)});
var loaded=0;[backdrop,coreImg,satImg].forEach(function(i){var done=function(){if(++loaded===3)start()};if(i.complete)done();else{i.onload=done;i.onerror=done}});
function start(){(document.fonts?document.fonts.ready:Promise.resolve()).then(function(){fit();if(REDUCED||FIXED!=null)render(FIXED!=null?FIXED:31);else requestAnimationFrame(frame)})}
})();
</script>
</html>
